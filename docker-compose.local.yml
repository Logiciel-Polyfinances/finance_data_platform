services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - finance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_network

  minio:
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    # Literal throwaway local creds -- NOT interpolated from ${ACCESS_KEY_ID}.
    # A real .env in this repo holds live AWS keys, and compose would otherwise
    # substitute those here, so MinIO's root would silently become the real AWS
    # key while the backend authenticates with minioadmin -> InvalidAccessKeyId.
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_network

  # One-shot: create the data-lake bucket if it doesn't exist, then exit.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/finance-data-lake &&
        echo 'bucket finance-data-lake ready'
      "
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pre-authenticate the local UI: bake the local API key into the build
        # so /app works without pasting a key. Matches API_KEY in .env.local.
        VITE_API_KEY: local-dev-key
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  finance_pgdata:
  minio_data:

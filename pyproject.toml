[project]
name = "finance-data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    # ASGI -> AWS Lambda adapter (API Gateway HTTP API events), see src/main.py::handler.
    "mangum==0.19.0",
    "sqlalchemy==2.0.29",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "matplotlib==3.8.4",
    "pyarrow==15.0.2",
    "polars==0.20.16",
    "requests==2.31.0",
    "httpx==0.27.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    # Only used by the local docker stack (docker-compose.local.yml); no Redis in
    # AWS -- src/core/cache.py / ratelimit.py fail open without REDIS_URL.
    "redis==5.0.3",
    "python-dotenv==1.0.1",
    # 0.2.37 (early 2024) broke against Yahoo's cookie/crumb + browser-impersonation
    # requirements -- .info / .download started returning empty bodies
    # ("Expecting value: line 1 column 1"). 0.2.66 bundles the curl_cffi-based
    # fix. Keep on the 0.2.x line the code was written against (1.x has API changes).
    "yfinance==0.2.66",
    "boto3==1.34.69",
    "pendulum==3.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "black==24.3.0",
    "ruff==0.3.4",
    "pre-commit==3.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "src/notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names...)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501", # line length is handled by the formatter, not worth failing CI over
    "E712", # `Column == True` is required SQLAlchemy filter syntax, not a Python truthiness check
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"alembic/env.py" = ["F401", "E402"]  # config/logging must be set up before importing models

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
